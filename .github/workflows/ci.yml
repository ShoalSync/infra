name: CI

on:
  # Branch pushes are covered by their pull request; one runner serves every repo.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # The monorepo is private. The org's GitHub App mints a token, valid for an hour, that can
      # only read tidefell/tidefell; Nix uses it to fetch the pinned release.
      - name: Token for the monorepo
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CROSS_REPO_CI_APP }}
          private-key: ${{ secrets.CROSS_REPO_CI_KEY }}
          owner: Tidefell
          repositories: tidefell
          permission-contents: read
      - uses: DeterminateSystems/nix-installer-action@v16
      # The always-on check boots VMs, which need KVM inside Nix's build sandbox: the build
      # users, not only the runner's user, must be able to open /dev/kvm.
      - name: KVM in the build sandbox
        run: |
          ls -l /dev/kvm || true
          nix config show system-features
          nix build --no-link --print-build-logs --impure --expr '
            derivation {
              name = "kvm-check";
              system = builtins.currentSystem;
              builder = "/bin/sh";
              requiredSystemFeatures = [ "kvm" ];
              args = [ "-c" "if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo KVM is usable > $out; else echo /dev/kvm is missing or not accessible to the build user; exit 1; fi" ];
            }'
      - name: Check
        # Through the environment rather than the installer's extra-conf, which is skipped when
        # the runner already has Nix.
        env:
          NIX_CONFIG: access-tokens = github.com=${{ steps.token.outputs.token }}
        run: nix flake check --print-build-logs
